[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freellm-health-checker"
version = "0.1.0"
description = "A modular real-time health, latency, and reliability checker for free LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Free LLM API Community" }
]
keywords = [
    "llm",
    "free-llm",
    "health-check",
    "monitoring",
    "api-health",
    "groq",
    "openai-compatible",
    "ai-apis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
freellm-health = "freellm_health_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["freellm_health_checker*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = ["tests"]
